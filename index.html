<!DOCTYPE html>
<html>
    <body>
    <head>
        <meta charaset="UTF-8">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/fonts.css">
        <title>To-Do App</title>
        <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    </head>
    <body>
        <header>
            <div id="logo">
        <img src="img/logo.svg" alt="To-Do App Logo">
        <h1>To-Do App</h1>
    </div>
    <form>
        <input type="text" id="new-task-input" placeholder="Was hast du geplant?">
        <input type="submit" id="new-task-submit" value="Task hinzufügen">
    </form> 
        </header>
        <main>
        <h2>Tasks</h2>
        <div id="tasks">
            <div class="task">
                <input type="text" class="text" value="Task 1">
                <button class="edit">Bearbeiten</button>
                <button class="delete">Löschen</button>
            </div>
    </main>
    </body>
</html>
